
<!DOCTYPE html>

<head>

    <title>Desplegable Personalizado</title>
<link rel="stylesheet" href="./css/estilos.css">

</head>

<body>

    <h1>Desplegable Personalizado</h1>

    <p>Selecciona una opcion de la lista.</p>

    
<div class="contenedor">

    <div class="desplegable" id="desplegable">

        <button class="botonDesplegable" id="botonDesplegable">

    <span id="textoSeleccionado">Selecciona una opcion</span>

    <span id="flecha">▼</span>

</button>

        <div class="listaOpciones" id="listaOpciones">

            <div class="opcion">Manzana</div>
            <div class="opcion">Banana</div>
            <div class="opcion">Naranja</div>
            <div class="opcion">Uva</div>
            <div class="opcion">Fresa</div>

        </div>

    </div>

</div>


    <script src="js/script.js"></script>
